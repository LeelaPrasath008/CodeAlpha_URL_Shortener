<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        .container{
            background:white;
            width:100%;
            max-width:500px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:10px;
        }

        .subtitle{
            color:#666;
            margin-bottom:25px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            margin-bottom:15px;
            outline:none;
        }

        input:focus{
            border-color:#667eea;
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#667eea;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#5563d6;
        }

        .result-card{
            margin-top:20px;
            background:#f8f9fa;
            padding:15px;
            border-radius:10px;
            text-align:left;
        }

        .result-card p{
            margin-bottom:8px;
        }

        .short-link{
            display:block;
            margin-top:10px;
            color:#667eea;
            font-weight:bold;
            text-decoration:none;
            word-break:break-all;
        }

        .short-link:hover{
            text-decoration:underline;
        }

        .copy-btn{
            margin-top:15px;
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#28a745;
            color:white;
            cursor:pointer;
            font-size:15px;
        }

        .copy-btn:hover{
            background:#218838;
        }

        .error{
            margin-top:15px;
            color:red;
            font-weight:bold;
        }

        .success{
            margin-top:15px;
            color:green;
            font-weight:bold;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🔗 URL Shortener</h1>

    <p class="subtitle">
        Convert long URLs into short and shareable links
    </p>

    <input
        type="text"
        id="urlInput"
        placeholder="Enter URL (e.g. https://google.com)"
    >

    <button class="btn" onclick="shortenUrl()">
        Shorten URL
    </button>

    <div id="result"></div>

</div>

<script>

async function shortenUrl(){

    const url =
        document.getElementById("urlInput").value.trim();

    if(!url){

        document.getElementById("result").innerHTML =
        `
            <p class="error">
                Please enter a URL
            </p>
        `;

        return;
    }

    try{

        const response = await fetch('/api/shorten',{
    method:'POST',
    headers:{
        'Content-Type':'application/json'
    },
    body:JSON.stringify({
        url:url
    })
});

const data = await response.json();

if(!response.ok){

    document.getElementById("result").innerHTML =
    `
        <p class="error">
            ${data.error}
        </p>
    `;

    return;
}

        const shortUrl =
            window.location.origin +
            "/" +
            data.short_code;

        document.getElementById("result").innerHTML =
        `
            <div class="result-card">

                <p><strong>Original URL:</strong></p>
                <p>${data.original_url}</p>

                <br>

                <p><strong>Short URL:</strong></p>

                <a
                    href="${shortUrl}"
                    target="_blank"
                    class="short-link"
                    id="shortUrlLink"
                >
                    ${shortUrl}
                </a>

                <button
                    class="copy-btn"
                    onclick="copyUrl()"
                >
                    Copy URL
                </button>

            </div>
        `;

    }
    catch(error){

        document.getElementById("result").innerHTML =
        `
            <p class="error">
                Something went wrong.
            </p>
        `;

        console.error(error);
    }
}

async function copyUrl(){

    const shortUrl =
        document.getElementById("shortUrlLink").href;

    try{

        await navigator.clipboard.writeText(shortUrl);

        alert("URL Copied Successfully!");

    }
    catch(error){

        alert("Failed to copy URL");

        console.error(error);
    }
}

</script>

</body>
</html>
